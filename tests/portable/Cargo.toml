[package]
name = "tacklecast-portable-checks"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
naga = { version = "24", features = ["wgsl-in"] }
wgpu = { package = "wgpu-types", version = "=24.0.0" }
image = { version = "=0.25.10", default-features = false, features = ["ico", "png"] }
